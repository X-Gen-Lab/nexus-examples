schema = 2
board = "stm32f407zg_qiming_v41"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"
components = ["uart-owner"]

[hardware]
debug_port = "swd"
nor_population = "absent"
p21 = "disconnected"
p15 = "disconnected"
p5 = "disconnected"
display_module = "absent"
touch_module = "absent"
sd_card = "absent"
sram_population = "absent"
camera_module = "absent"
audio_module = "absent"
temperature_module = "absent"
infrared_module = "absent"

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 32768
libc_heap_bytes = 0

[gpio.status]
active_high = false
binding = "led0"
mode = "output"

[uart.console]
binding = "uart1"
mode = "irq"
baud = 115200

[uart.console.rx]
format = "events"
capacity = 32

[uart.console.irq]
priority = 5
