# External Native examples: platform-only configuration, no private product schema.
CONFIG_PLATFORM_NATIVE=y
CONFIG_OSAL_NATIVE=y
# The finite Log run keeps all twelve TX records in the Native observation ring.
# This is host-model storage, not a physical serial driver or hidden consumer.
CONFIG_UART0_TX_BUFFER_SIZE=512
CONFIG_SERVICE_STORAGE=y
CONFIG_SERVICE_SECURITY=y
CONFIG_CRYPTO_PROVIDER_OPENSSL=n
CONFIG_SERVICE_UPDATE=n
CONFIG_SERVICE_PROTOCOLS=y
CONFIG_SERVICE_INDUSTRIAL=y
CONFIG_FRAMEWORK_CONFIG=y
CONFIG_FRAMEWORK_LOG=y
CONFIG_FRAMEWORK_SHELL=y
CONFIG_FRAMEWORK_INIT=n
# Bounded public Config example: 11 entries, values shorter than 64 bytes.
CONFIG_MANAGER_KEY_LIMIT=32
CONFIG_MANAGER_DEFAULT_KEYS=32
CONFIG_MANAGER_KEY_LENGTH=32
CONFIG_MANAGER_VALUE_SIZE=64
CONFIG_MANAGER_DEFAULT_VALUE_SIZE=64
CONFIG_MANAGER_PERSISTENCE_BUFFER=2048
