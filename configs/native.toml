schema = 2
board_package = "../tests/support/native-board"
backend = "native"
clock = "model"
optimization = "Os"
components = ["uart-owner", "spi-owner", "bmp280", "bmp280-spi", "log", "storage", "settings", "modbus-rtu"]

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 262144
libc_heap_bytes = 0

[gpio.status]
binding = "led0"
mode = "output"

[uart.console]
binding = "uart0"
mode = "irq"
baud = 115200

# Selected software UART: start + eight data + one stop, ten wire bits.
[uart.console.frame]
data_bits = 8
parity = "none"
stop_bits = 1
flow = "none"

[uart.console.rx]
format = "events"
capacity = 32

[uart.console.irq]
priority = 5

[spi.spi0]
binding = "spi0"
mode = "short-poll"
max_hz = 1000000

[spi_device.sensor0]
controller = "spi0"

[spi_device.sensor1]
controller = "spi0"

[watchdog.watchdog0]
binding = "watchdog0"
mode = "independent"
