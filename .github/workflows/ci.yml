name: Source SDK integration
'on':
  push:
    branches:
      - main
      - develop
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native and installed SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      arm_presets: ${{ steps.matrix.outputs.presets }}
    steps:
      - name: Checkout application sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'false'
          fetch-depth: '1'
      - name: Checkout pinned SDK
        run: git submodule update --init --depth 1 -- external/nexus
      - name: Checkout project host framework
        run: git submodule update --init --depth 2 -- external/googletest
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare host build dependencies
        timeout-minutes: '10'
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y gcc g++
          python3 scripts/setup_dev_tools.py --skip-hooks
          .venv/bin/python -m pip install -r external/nexus/dependencies/environment-tools.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare selected SDK dependencies
        run: python3 external/nexus/tools/dev/dev.py prepare --scope native --allow-network
      - name: Select the maintained ARM matrix
        id: matrix
        run: printf 'presets=%s\n' "$(python3 scripts/local_ci.py --list-arm-presets)" >> "$GITHUB_OUTPUT"
      - name: Run complete local Native and installed SDK integration
        run: python3 scripts/local_ci.py --scope native --output build/ci-native --parallel 4
      - name: Retain Native artifacts and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples-native-debug
          path: |-
            build/ci-native/
            build/native-debug/tdd/
            build/native-debug/tests/*execution/
            build/native-debug/ctest-results.xml
            build/native-debug/build.log
            build/native-debug/CMakeCache.txt
            build/native-debug/compile_commands.json
            build/native-debug/nexus/generated/
            build/native-debug/bin/
          retention-days: 14
  arm:
    name: ${{ matrix.preset }} linked firmware
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.native.outputs.arm_presets) }}
    steps:
      - name: Checkout application sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'false'
          fetch-depth: '1'
      - name: Checkout pinned SDK
        run: git submodule update --init --depth 1 -- external/nexus
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare host build dependencies
        timeout-minutes: '10'
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y gcc g++
          python3 scripts/setup_dev_tools.py --skip-hooks
          .venv/bin/python -m pip install -r external/nexus/dependencies/environment-tools.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Prepare selected SDK dependencies
        run: python3 external/nexus/tools/dev/dev.py prepare --scope native --allow-network
      - name: Run the maintained ARM integration
        env:
          PRESET: ${{ matrix.preset }}
        run: |-
          python3 scripts/local_ci.py --scope arm --preset "$PRESET" \
            --arm-toolchain "$RUNNER_TEMP/nexus-arm-toolchain" \
            --output "build/ci-$PRESET" --parallel 4
      - name: Retain firmware and static validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples-${{ matrix.preset }}
          path: |-
            build/ci-${{ matrix.preset }}/
            build/${{ matrix.preset }}/build.log
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/nexus/generated/
            build/${{ matrix.preset }}/bin/
          retention-days: 14
