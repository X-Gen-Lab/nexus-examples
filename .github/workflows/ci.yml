name: Example source SDK integration

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_nexus_ref:
        description: 'Optional complete lowercase Nexus commit SHA; empty validates the formal pin'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}-${{ inputs.candidate_nexus_ref || 'pinned' }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build and execution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned SDK and recursive dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Validate candidate reference
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_NEXUS_REF: ${{ inputs.candidate_nexus_ref }}
        run: |
          if [[ -n "$CANDIDATE_NEXUS_REF" && ! "$CANDIDATE_NEXUS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Candidate must be a complete lowercase 40-digit commit SHA" >&2
            exit 1
          fi
      - name: Checkout explicit candidate SDK and recursive dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_nexus_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: X-Gen-Lab/nexus
          ref: ${{ inputs.candidate_nexus_ref }}
          path: external/nexus
          submodules: recursive
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Prepare host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ libssl-dev
          python3 -m pip install kconfiglib==14.1.0
      - name: Verify source dependency identity
        env:
          CANDIDATE_NEXUS_REF: ${{ inputs.candidate_nexus_ref }}
        run: |
          candidate_arguments=()
          if [[ -n "$CANDIDATE_NEXUS_REF" ]]; then
            candidate_arguments+=(--candidate-nexus-commit "$CANDIDATE_NEXUS_REF")
          fi
          python3 scripts/test_repository.py "${candidate_arguments[@]}" --report build/native-debug/dependency-identity.json
      - name: Verify runner rejects empty and skipped execution
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and run Native examples
        run: python3 scripts/build.py --preset native-debug --test --parallel 4
      - name: Retain Native artifacts and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples-native-debug-${{ inputs.candidate_nexus_ref || 'pinned' }}
          path: |
            build/native-debug/build.log
            build/native-debug/ctest-results.xml
            build/native-debug/dependency-identity.json
            build/native-debug/CMakeCache.txt
            build/native-debug/compile_commands.json
            build/native-debug/nexus/generated/*
            build/native-debug/nexus/bin/*
          retention-days: 14

  arm:
    name: ${{ matrix.preset }} linked firmware
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - stm32-discovery-baremetal-release
          - stm32-discovery-freertos-release
          - stm32-qiming-baremetal-release
          - stm32-qiming-freertos-release
          - stm32-sky-baremetal-release
          - stm32-sky-freertos-release
          - gd32-liangshan-baremetal-release
          - gd32-liangshan-freertos-release
    steps:
      - name: Checkout pinned SDK and recursive dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Validate candidate reference
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_NEXUS_REF: ${{ inputs.candidate_nexus_ref }}
        run: |
          if [[ -n "$CANDIDATE_NEXUS_REF" && ! "$CANDIDATE_NEXUS_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Candidate must be a complete lowercase 40-digit commit SHA" >&2
            exit 1
          fi
      - name: Checkout explicit candidate SDK and recursive dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_nexus_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: X-Gen-Lab/nexus
          ref: ${{ inputs.candidate_nexus_ref }}
          path: external/nexus
          submodules: recursive
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Prepare host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++
          python3 -m pip install kconfiglib==14.1.0
      - name: Verify source dependency identity
        env:
          CANDIDATE_NEXUS_REF: ${{ inputs.candidate_nexus_ref }}
        run: |
          candidate_arguments=()
          if [[ -n "$CANDIDATE_NEXUS_REF" ]]; then
            candidate_arguments+=(--candidate-nexus-commit "$CANDIDATE_NEXUS_REF")
          fi
          python3 scripts/test_repository.py "${candidate_arguments[@]}" --report build/${{ matrix.preset }}/dependency-identity.json
      - name: Prepare SHA-256 locked ARM GNU toolchain
        run: |
          python3 external/nexus/scripts/ci/install_arm_toolchain.py --install-dir "$RUNNER_TEMP/nexus-arm-toolchain"
          echo "$RUNNER_TEMP/nexus-arm-toolchain/bin" >> "$GITHUB_PATH"
      - name: Build real ARM firmware
        run: python3 scripts/build.py --preset ${{ matrix.preset }} --parallel 4
      - name: Verify linked firmware static contract
        run: >-
          python3 external/nexus/scripts/ci/validate_firmware_elf.py
          --build-dir build/${{ matrix.preset }}/nexus
          --report build/${{ matrix.preset }}/firmware-static-contract.json
      - name: Retain firmware and static validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples-${{ matrix.preset }}-${{ inputs.candidate_nexus_ref || 'pinned' }}
          path: |
            build/${{ matrix.preset }}/build.log
            build/${{ matrix.preset }}/dependency-identity.json
            build/${{ matrix.preset }}/firmware-static-contract.json
            build/${{ matrix.preset }}/CMakeCache.txt
            build/${{ matrix.preset }}/compile_commands.json
            build/${{ matrix.preset }}/nexus/generated/*
            build/${{ matrix.preset }}/nexus/bin/*
          retention-days: 14
