schema = 2
board = "native_reference"
backend = "native"
clock = "model"
optimization = "Os"

[memory]
main_stack_bytes = 2048
libc_heap_bytes = 0

[gpio.status]
active_high = true
binding = "led0"
mode = "output"

[uart.console]
binding = "uart0"
mode = "irq"
baud = 115200

[uart.console.rx]
format = "events"
capacity = 32

[uart.console.irq]
priority = 5
