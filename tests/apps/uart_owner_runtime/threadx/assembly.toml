schema = 2
board_package = "../../../support/native-board"
backend = "threadx"
clock = "model"
optimization = "Os"
components = ["uart-owner"]

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 262144
libc_heap_bytes = 0

[uart.console]
binding = "uart0"
mode = "irq"
baud = 115200

[uart.console.frame]
data_bits = 8
parity = "none"
stop_bits = 1
flow = "none"

[uart.console.rx]
format = "events"
capacity = 32

[uart.console.irq]
priority = 5
