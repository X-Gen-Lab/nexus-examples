# Exact software reference; no physical wiring or measured service bound.
schema = 2
board_package = "software-board"
backend = "baremetal"
clock = "hse8-pll168"
optimization = "Os"

[memory]
main_stack_bytes = 4096
libc_heap_bytes = 0
static_ram_limit_bytes = 32768
flash_load_limit_bytes = 65536

[adc.samples]
binding = "adc_scan"
mode = "trigger-dma-continuous"
channels = [0, 1]
sample_times = [0, 7]
reference_mv = 3300

[adc.samples.irq]
priority = 5
calls_os = false

[adc.samples.stream]
max_units_per_second = 1000
units_per_block = 100
blocks = 8
release_delay_us = 500000
target_delay_us = 99999
on_exhaustion = "stop-and-report-gap"
source = "declared software reference envelope; no measured timing"
