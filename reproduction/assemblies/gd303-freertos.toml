schema = 2
board = "gd32f303_reference"
backend = "freertos"
clock = "irc8"
optimization = "Os"
components = ["uart-owner"]

[memory]
main_stack_bytes = 2048
flash_load_limit_bytes = 65536
static_ram_limit_bytes = 16384
libc_heap_bytes = 0

[gpio.led0]
binding = "gpio0"
mode = "output"

[uart.uart1]
binding = "uart0"
mode = "irq-bytes"
baud = 115200

[uart.uart1.rx]
format = "bytes"
capacity = 32

[uart.uart1.irq]
priority = 5
calls_os = true
