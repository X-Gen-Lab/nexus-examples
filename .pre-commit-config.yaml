minimum_pre_commit_version: '4.3.0'
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: nexus-example-style
        name: Nexus example format, comments and text
        entry: python scripts/check_style.py --report build/quality/style.json
        language: python
        stages: [pre-commit]
        pass_filenames: true
        always_run: true
        require_serial: true
      - id: nexus-example-commit
        name: Nexus Conventional Commit policy
        entry: python scripts/check_commit_message.py
        language: python
        stages: [commit-msg]
